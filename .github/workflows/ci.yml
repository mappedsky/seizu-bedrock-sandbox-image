name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Deny all permissions by default; grant only what each job needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false

      - name: Run pre-commit
        run: |
          uv sync --frozen
          uv run --frozen --no-sync pre-commit run --all-files --show-diff-on-failure

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false

      - name: Run unit tests
        run: |
          uv sync --frozen
          uv run --frozen --no-sync pytest -v

  # Build natively on each architecture and check the result as AgentCore
  # Runtime will use it. linux/arm64 is the one the runtime runs; linux/amd64
  # is published for running the image locally.
  image:
    name: image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: linux/amd64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker buildx build --load --tag seizu-sandbox:ci .

      - name: Check image
        run: scripts/check-image.sh seizu-sandbox:ci
